services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:?}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      DB_DATABASE: ${DB_DATABASE:?}
      BOT_TOKEN: ${BOT_TOKEN:?}
      BOT_WEBAPP_URL: ${BOT_WEBAPP_URL:-}
      S3_ENDPOINT: ${S3_ENDPOINT:?}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
      S3_BUCKET: ${S3_BUCKET:-photos}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?}
      SERVICE_FQDN_APP_8000:
    command: ['sh', '-c', 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers']
