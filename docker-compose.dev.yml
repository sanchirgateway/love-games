services:
  db:
    image: postgres:17-alpine
    container_name: bloomy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bloomy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloomy}
      POSTGRES_DB: ${DB_DATABASE:-bloomy}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
