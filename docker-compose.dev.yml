services:
  db:
    image: postgres:17-alpine
    container_name: bloomy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bloomy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloomy}
      POSTGRES_DB: ${DB_DATABASE:-bloomy}
      TZ: UTC
    ports:
      - "${DB_PORT:-5470}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: bloomy-seaweedfs
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bloomy}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bloomy-secret}
    # Ключи S3 задаются только через JSON-конфиг, поэтому генерируем его из env при старте.
    # weed server в одном процессе поднимает master, volume, filer и S3-шлюз.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "bloomy",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0           -master.volumeSizeLimitMB=1024           -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      - "${S3_PORT:-9010}:8333"
      - "${S3_CONSOLE_PORT:-9011}:8888"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:8333/healthz",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  seaweedfs-init:
    image: amazon/aws-cli:latest
    container_name: bloomy-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-bloomy}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-bloomy-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-photos}
    entrypoint: >
      sh -c "aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$S3_BUCKET 2>/dev/null ||
             aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$S3_BUCKET"
    restart: "no"

  # Миграции перед стартом приложения: выполняются и контейнер завершается
  migrate:
    build: .
    image: bloomy-bot:dev
    container_name: bloomy-migrate
    env_file: .env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: bloomy-bot:dev
    container_name: bloomy-app
    restart: unless-stopped
    env_file: .env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
      S3_ENDPOINT: http://seaweedfs:8333
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    volumes:
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweeddata:
