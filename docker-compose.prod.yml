# Прод (Coolify, build pack "Docker Compose").
# Переменные задаются в Coolify → Environment Variables: Coolify сам находит все ${VAR}
# в этом файле и показывает их в UI. ${VAR:?} — обязательная, ${VAR:-x} — с дефолтом.
# В контейнер попадает только то, что перечислено в environment: — env_file не используем.
#
# Локально тот же файл: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait

x-app-common: &app-common
  build: .
  environment: &app-env
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: ${DB_USER:?}
    DB_PASSWORD: ${DB_PASSWORD:?}
    DB_DATABASE: ${DB_DATABASE:?}
    BOT_TOKEN: ${BOT_TOKEN:?}
    BOT_WEBAPP_URL: ${BOT_WEBAPP_URL:-}
    APP_DEBUG: "false"
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_DATABASE:?}
      TZ: UTC
    # Только на localhost сервера: снаружи порт закрыт, DataGrip подключается через SSH-туннель
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-common
    restart: unless-stopped
    # Один процесс и одна реплика: бот работает через polling, второй экземпляр
    # получит TelegramConflictError. CMD (без --reload) берётся из Dockerfile.
    # Порты не публикуем: домен назначается в Coolify (https://домен:8000), трафик идёт через его Traefik
    expose:
      - "8000"
    healthcheck:
      # В alpine-образе нет curl — проверяем средствами Python
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
