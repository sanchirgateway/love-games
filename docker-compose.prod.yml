services:
  db:
    image: postgres:17-alpine
    container_name: bloomy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-bloomy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bloomy}
      POSTGRES_DB: ${DB_DATABASE:-bloomy}
      TZ: UTC
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # Новых community-образов MinIO больше не выпускается, latest = RELEASE.2025-09-07T16-13-09Z
    image: minio/minio:latest
    container_name: bloomy-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-bloomy}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-bloomy-secret}
    ports:
      - "${S3_PORT:-9010}:9000"            # S3 API
      - "${S3_CONSOLE_PORT:-9011}:9001"    # веб-консоль
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Одноразовый контейнер: создаёт bucket и завершается
  minio-init:
    image: minio/mc:latest
    container_name: bloomy-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-bloomy}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-bloomy-secret}
      S3_BUCKET: ${S3_BUCKET:-photos}
    entrypoint: >
      sh -c "mc alias set local http://minio:9000 $$S3_ACCESS_KEY $$S3_SECRET_KEY &&
             mc mb --ignore-existing local/$$S3_BUCKET"
    restart: "no"

  # Миграции перед стартом приложения: выполняются и контейнер завершается
  migrate:
    build: .
    image: bloomy-bot:dev
    container_name: bloomy-migrate
    env_file: .env.dev
    environment:
      DB_HOST: db
      DB_PORT: 5432
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    image: bloomy-bot:dev
    container_name: bloomy-app
    restart: unless-stopped
    env_file: .env.dev
    environment:
      # Внутри сети compose сервисы доступны по имени и внутренним портам
      DB_HOST: db
      DB_PORT: 5432
      S3_ENDPOINT: http://minio:9000
    # --reload + примонтированный код: правки применяются без пересборки образа
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app:ro
      - ./config:/app/config:ro
      - ./migrations:/app/migrations:ro
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  miniodata:
