# Прод (Coolify, build pack "Docker Compose").
# Переменные задаются в Coolify → Environment Variables: Coolify сам находит все ${VAR}
# в этом файле и показывает их в UI. ${VAR:?} — обязательная, ${VAR:-x} — с дефолтом.
# В контейнер попадает только то, что перечислено в environment: — env_file не используем.
#
# Локально тот же файл: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --wait

x-app-common: &app-common
  build: .
  environment: &app-env
    DB_HOST: db
    DB_PORT: 5432
    DB_USER: ${DB_USER:?}
    DB_PASSWORD: ${DB_PASSWORD:?}
    DB_DATABASE: ${DB_DATABASE:?}
    BOT_TOKEN: ${BOT_TOKEN:?}
    BOT_WEBAPP_URL: ${BOT_WEBAPP_URL:-}
    S3_ENDPOINT: http://seaweedfs:8333
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
    S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    S3_BUCKET: ${S3_BUCKET:-photos}
    APP_DEBUG: "false"
    APP_ADMIN_API_KEY: ${APP_ADMIN_API_KEY:-}
    APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:?}
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  db:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: ${DB_DATABASE:?}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: *logging

  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    restart: unless-stopped
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    # Ключи S3 задаются только через JSON-конфиг, поэтому генерируем его из env при старте.
    # weed server в одном процессе поднимает master, volume, filer и S3-шлюз.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities": [{"name": "bloomy",
          "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOF
        exec weed server -dir=/data -ip.bind=0.0.0.0 -master.volumeSizeLimitMB=1024 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    # Порты не публикуем: фото отдаёт приложение, S3 доступен только внутри сети compose
    expose:
      - "8333"
    volumes:
      - seaweeddata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # Создаёт бакет, если его ещё нет, и завершается
  seaweedfs-init:
    image: amazon/aws-cli:2.27.0
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-photos}
    entrypoint: >
      sh -c "aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$S3_BUCKET 2>/dev/null ||
             aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$S3_BUCKET"
    restart: "no"
    logging: *logging

  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    <<: *app-common
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      # В alpine-образе нет curl — проверяем средствами Python
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      db:
        condition: service_healthy
      seaweedfs-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  seaweeddata:
