version: "3"

dotenv: [".env.dev"]

vars:
  COMPOSE: docker compose -f docker-compose.dev.yml

tasks:
  default:
    desc: Список задач
    cmds:
      - task --list
    silent: true

  install:
    desc: Установить зависимости
    cmds:
      - uv sync

  db:up:
    desc: Поднять Postgres и дождаться готовности
    cmds:
      - "{{.COMPOSE}} up -d --wait db"

  db:down:
    desc: Остановить Postgres
    cmds:
      - "{{.COMPOSE}} down"

  db:reset:
    desc: Удалить Postgres вместе с данными и поднять заново
    prompt: Все данные БД будут удалены. Продолжить?
    cmds:
      - "{{.COMPOSE}} down -v"
      - task: db:up
      - task: migrate

  db:logs:
    desc: Логи Postgres
    cmds:
      - "{{.COMPOSE}} logs -f db"

  # --- Хранилище фото ---

  storage:up:
    desc: Поднять SeaweedFS и создать bucket
    cmds:
      - "{{.COMPOSE}} up -d --wait seaweedfs"
      - "{{.COMPOSE}} run --rm seaweedfs-init"

  storage:logs:
    desc: Логи SeaweedFS
    cmds:
      - "{{.COMPOSE}} logs -f seaweedfs"

  bot:avatar:
    desc: 'Поставить аватарку бота: task bot:avatar [-- path/to/photo.png]'
    cmds:
      - uv run python -m app.scripts.set_avatar {{.CLI_ARGS}}

  # --- Миграции ---

  migrate:
    desc: Накатить все миграции
    cmds:
      - uv run alembic upgrade head

  migrate:new:
    desc: 'Создать миграцию по моделям: task migrate:new -- "описание"'
    preconditions:
      - sh: '[ -n "{{.CLI_ARGS}}" ]'
        msg: 'Укажите описание: task migrate:new -- "create dates"'
    cmds:
      - uv run alembic revision --autogenerate -m "{{.CLI_ARGS}}"

  migrate:down:
    desc: Откатить последнюю миграцию
    cmds:
      - uv run alembic downgrade -1

  migrate:status:
    desc: Текущая ревизия и история миграций
    cmds:
      - uv run alembic current
      - uv run alembic history --indicate-current

  # --- Запуск ---

  run:
    desc: Запустить приложение
    cmds:
      # Не uvicorn --reload: на Windows он шлёт Ctrl+C всей консоли, и nushell закрывается
      - uv run python scripts/dev.py --port 8000

  up:
    desc: Запустить всё в Docker (БД, SeaweedFS, миграции, приложение)
    cmds:
      - "{{.COMPOSE}} up -d --build app"

  logs:
    desc: Логи приложения в Docker
    cmds:
      - "{{.COMPOSE}} logs -f app"

  dev:
    desc: Поднять БД и SeaweedFS, накатить миграции и запустить приложение
    cmds:
      - task: db:up
      - task: storage:up
      - task: migrate
      - task: run
